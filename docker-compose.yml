version: '3.8'

services:
  codebuddy2api:
    # Build with the Dockerfile in this directory.
    build: .
    # Tag the built image.
    image: xueyue052/codebuddy2api:latest
    # Restart the container unless it was explicitly stopped.
    restart: unless-stopped
    # Map the configured host port to container port 8001.
    ports:
      - "${CODEBUDDY_PORT:-8001}:8001"
    # Persist configuration and credentials on the host.
    volumes:
      # Mount the complete configuration directory.
      - ./config:/app/config
      # Mount the legacy credential directory.
      - ./.codebuddy_creds:/app/.codebuddy_creds
    # Load application environment variables.
    env_file:
      - ${CODEBUDDY_ENV_FILE:-.env}
    # Expose deployment modes explicitly while allowing .env overrides.
    environment:
      CODEBUDDY_CLIENT_AUTH_MODE: ${CODEBUDDY_CLIENT_AUTH_MODE:-relay}
      CODEBUDDY_ADMIN_PASSWORD: ${CODEBUDDY_ADMIN_PASSWORD:-}
      CODEBUDDY_UPSTREAM_API_KEY_HEADER: ${CODEBUDDY_UPSTREAM_API_KEY_HEADER:-bearer}
